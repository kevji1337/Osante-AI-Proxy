# golangci-lint configuration (v2 schema).
#
# Migrated from the v1 layout: `linters.disable-all` -> `linters.default`,
# `linters-settings` -> `linters.settings`, `issues.exclude-rules` ->
# `linters.exclusions.rules`, and gofmt moved to the new `formatters` section.
# The v9 GitHub action only accepts golangci-lint v2, so the schema bump and the
# action bump go together.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose # http.Response.Body must be closed
    - errcheck # missing error checks
    - errorlint # %w / errors.Is / errors.As misuse
    - govet # standard go vet checks
    - ineffassign # unused assignments
    - misspell # spelling
    - nilerr # returning nil after a non-nil error
    - nolintlint # malformed //nolint directives
    - staticcheck # subsumes many older linters
    - unconvert # redundant type conversions
    - unused # unused symbols
    # Deliberately off: noctx. Every remaining finding is a database/sql call in
    # internal/storage, whose whole API is context-free by design (it is a local
    # SQLite file behind a single-writer mutex, not a network service). Enabling it
    # would mean threading a context through every storage method for no behaviour
    # change. The HTTP half of noctx — which did matter — is fixed, so if the
    # storage API ever grows contexts, turn this on in the same change.

  settings:
    misspell:
      locale: US

  exclusions:
    # Don't bury problems in generated-file heuristics; this repo has none.
    generated: strict
    rules:
      # Tests: `_ = w.Write(...)` and unclosed recorder bodies are idiomatic there.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
