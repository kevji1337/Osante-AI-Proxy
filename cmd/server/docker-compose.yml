services:
  osante:
    build:
      context: ../..
      dockerfile: cmd/server/Dockerfile
    container_name: osante
    restart: unless-stopped
    ports:
      # host:container — the admin API and UI are unauthenticated, so bind the
      # host side to loopback and reach it through an SSH tunnel or a reverse
      # proxy if you need remote access.
      - "127.0.0.1:3021:12710"
    volumes:
      - ./osante/:/data
    environment:
      - OSANTE_PORT=12710
      - OSANTE_DATA_DIR=/data
      - OSANTE_DB_PATH=/data/osante.db
      # Required in a container: the default 127.0.0.1 bind would make the
      # published port unreachable from the host.
      - OSANTE_BIND=0.0.0.0
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12710/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
